<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Keep DOCX files faithful to templates that specify Palatino Linotype while
    giving headless LibreOffice an open, metrically close preview substitute.
    The DOCX style name remains Palatino Linotype; this affects Linux rendering
    only when the proprietary font is unavailable.
  -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>Palatino Linotype</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>TeX Gyre Pagella</string>
    </edit>
  </match>
</fontconfig>
